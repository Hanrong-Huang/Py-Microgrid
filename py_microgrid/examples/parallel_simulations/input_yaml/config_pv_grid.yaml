# PV + Grid Configuration (Simple Grid-Tied Solar)
# ================================================================================
# SYSTEM DESCRIPTION:
# This configuration creates a simple grid-tied solar system. The grid provides
# all backup power and energy storage, making this the most cost-effective setup
# for areas with good solar resources and reliable grid connection.
#
# COMPONENTS ENABLED:
# ✓ PV Solar Array - Primary renewable energy source
# ✓ Grid Connection - Backup power and virtual storage
# ✗ Wind Turbines - Disabled (set to 0)
# ✗ Battery Storage - Disabled (grid provides storage)
# ✗ Backup Generator - Disabled (grid provides backup)
#
# USE CASES:
# - Residential rooftop solar
# - Commercial solar installations
# - Utility-scale solar farms
# - Net metering applications
# ================================================================================

name: pv_grid_connected

# ================================================================================
# SITE CONFIGURATION
# ================================================================================
site:
  data:
    lat: -33.5265                # Latitude (degrees) - REQUIRED
    lon: 149.1588                # Longitude (degrees) - REQUIRED  
    year: 2022                   # Weather data year
  
  # Load schedule (replace with your load file)
  desired_schedule: "path/to/your_load_data.csv"
  
  # Resource configuration
  solar: true                   # Enable solar resource (REQUIRED for PV)
  wind: false                   # Disable wind resource (not needed)
  wave: false                   # Disable wave resource
  
  # Resource files (auto-downloaded if not provided)
  solar_resource_file: ""       # Will be auto-downloaded for lat/lon
  wind_resource_file: ""        # Not needed since wind disabled

# ================================================================================
# TECHNOLOGY CONFIGURATIONS
# ================================================================================
technologies:

  # PV Solar Array - PRIMARY ENERGY SOURCE
  pv:
    system_capacity_kw: 30000.0   # PV capacity (kW) - WILL BE OPTIMIZED
    
    # Optional advanced parameters (uncomment to customize):
    # module_type: 0              # 0=standard silicon (19%), 1=premium (21%), 2=thin film (18%)
    # dc_ac_ratio: 1.3            # DC to AC ratio (1.2-1.4 typical)
    # tilt: 20.0                  # Panel tilt angle (degrees) - site latitude ±15°
    # azimuth: 180.0              # Panel azimuth (180=south, 90=east, 270=west)
    # gcr: 0.4                    # Ground coverage ratio (0.3-0.5)
    
    # Cost customization (uncomment to override defaults):
    # installed_cost_per_kw: 1500.0     # $/kW - Lower cost for utility-scale
    # om_cost_per_kw_per_year: 8.0      # $/kW/year - Reduced O&M for large systems

  # Wind Turbines - DISABLED
  wind:
    num_turbines: 0               # DISABLED: Set to 0
    turbine_rating_kw: 1000       # Not used when num_turbines = 0

  # Battery Storage - DISABLED
  battery:
    chemistry: LFPGraphite        # Not used when capacity = 0
    system_capacity_kwh: 0        # DISABLED: Grid provides storage
    system_capacity_kw: 0         # DISABLED: Grid provides storage

  # Backup Generator - DISABLED
  genset:
    interconnect_kw: 0            # DISABLED: Grid provides backup

  # Grid Connection - BACKUP POWER AND STORAGE
  grid:
    enabled: true                 # ENABLED: Grid-tied system
    interconnect_kw: 40000        # Grid interconnection capacity (kW)
    
    # Optional advanced parameters (uncomment to customize):
    # base_import_price: 0.12     # $/kWh - Grid import price (peak hours)
    # base_export_price: 0.08     # $/kWh - Solar export price (feed-in tariff)
    # peak_factor: 1.3            # - Peak hour price multiplier
    # off_peak_factor: 0.7        # - Off-peak hour price multiplier
    # peak_start: 16              # hour - Peak period start (4 PM)
    # peak_end: 20                # hour - Peak period end (8 PM)

  # Financial Configuration
  financial:
    Singleowner:
      analysis_period: 25         # years - Project lifetime (solar systems)
      real_discount_rate: 5.88    # % - Real discount rate

# ================================================================================
# SIMULATION CONFIGURATION  
# ================================================================================
config:
  dispatch_options:
    battery_dispatch: heuristic_load_following  # Not used (no battery)
    grid_charging: false          # Not applicable (no battery to charge)
    pv_charging_only: false       # Not applicable (no battery)
    solver: glpk                  # Optimization solver
    n_look_ahead_periods: 24      # hours - Daily forecast for solar

  simulation_options:
    start_year: 2022
    end_year: 2022
    time_steps_per_hour: 1        # Hourly simulation

  optimization_options:
    algorithm: nelder_mead        # Nelder-Mead optimization
    max_iterations: 1000
    tolerance: 1e-6

# ================================================================================
# OPTIMIZATION BOUNDS GUIDANCE
# ================================================================================
# When using this configuration with SystemOptimizer, set bounds as follows:
#
# bounds = [
#     (10000, 100000),  # PV capacity (kW) - ACTIVE (large range for utility-scale)
#     (0, 0),           # Wind turbines - DISABLED
#     (0, 0),           # Battery energy - DISABLED
#     (0, 0),           # Battery power - DISABLED
#     (0, 0)            # Genset capacity - DISABLED
# ]
#
# This system will optimize only PV capacity to minimize LCOE while meeting
# demand through solar generation + grid import/export.
# ================================================================================

# ================================================================================
# CUSTOMIZATION EXAMPLES
# ================================================================================
# 
# TO REDUCE COSTS:
# - Add: installed_cost_per_kw: 1200.0 under pv: section (very large scale)
# - Add: base_import_price: 0.10 under grid: section (cheaper grid power)
# - Add: module_type: 2 under pv: section (thin film - lower cost)
#
# TO IMPROVE SOLAR PERFORMANCE:
# - Add: module_type: 1 under pv: section (premium 21% efficiency)
# - Add: dc_ac_ratio: 1.4 under pv: section (more DC for clipping)
# - Add: tilt: 25.0 under pv: section (optimize for site latitude)
# - Add: gcr: 0.35 under pv: section (reduce shading losses)
#
# TO OPTIMIZE FOR NET METERING:
# - Add: base_export_price: 0.12 under grid: section (full retail rate)
# - Reduce PV bounds to match annual load: (5000, 20000)
# - Add: peak_factor: 1.0 under grid: section (flat rate structure)
#
# TO OPTIMIZE FOR TIME-OF-USE RATES:
# - Add: peak_factor: 2.0 under grid: section (high peak rates)
# - Add: peak_start: 15 under grid: section (3 PM peak start)
# - Add: peak_end: 21 under grid: section (9 PM peak end)
# - Increase PV bounds for peak shaving: (20000, 80000)
#
# FOR DIFFERENT SYSTEM SCALES:
# - Residential: bounds = [(5, 20), (0,0), (0,0), (0,0), (0,0)] * 1000
# - Commercial: bounds = [(50, 500), (0,0), (0,0), (0,0), (0,0)] * 1000  
# - Utility: bounds = [(1000, 10000), (0,0), (0,0), (0,0), (0,0)] * 1000
#
# FOR DIFFERENT CLIMATES:
# - Desert: Add module_type: 2 (thin film handles heat better)
# - Cloudy: Add module_type: 1 (premium modules for low light)
# - Snow: Add tilt: 45.0 (steep angle for snow shedding)
#
# TO CHANGE LOCATION:
# - Update lat/lon in site.data section
# - Clear solar_resource_file (will auto-download for new location)
# - Adjust tilt to site latitude ±15° for optimal angle
# ================================================================================