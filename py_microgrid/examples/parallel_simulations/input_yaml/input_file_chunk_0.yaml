# - config_pv_battery_genset.yaml (off-grid solar with backup)
# - config_wind_grid.yaml (grid-tied wind)
# - config_renewable_only.yaml (PV+Wind+Battery, no fossil fuels)
# - config_pv_grid.yaml (simple grid-tied solar)
# - config_storage_backup.yaml (Battery+Genset only)

name: input_file_chunk_0

# ================================================================================
# SITE CONFIGURATION
# ================================================================================
site:
  data:
    lat: -33.5265                 # Latitude (degrees) - REQUIRED
    lon: 149.1588                 # Longitude (degrees) - REQUIRED  
    year: 2022                    # Weather data year
    site_boundaries:              # Site boundary (optional)
      verts:
      - [3.06, 288.87]
      - [0.0, 1084.03]
      - [1784.05, 1084.24]
      - [1794.09, 999.64]
      - [1494.34, 950.97]
      - [712.64, 262.8]
      - [1216.98, 272.36]
      - [1217.76, 151.62]
      - [708.14, 0.0]
  
  # Load schedule (CSV file path)
  desired_schedule: C:\Users\Hanrong Huang\OneDrive - UNSW\Desktop\py_microgrid\py_microgrid\examples\parallel_simulations\load_data\Load data.csv
  
  # Resource files (auto-downloaded if not provided)
  solar_resource_file: c:/users/hanrong huang/onedrive - unsw/desktop/py_microgrid/py_microgrid/simulation/resource_files/solar/-33.5265_149.1588_psmv3_60_2022.csv
  wind_resource_file: c:/users/hanrong huang/onedrive - unsw/desktop/py_microgrid/py_microgrid/simulation/resource_files/wind/-33.5265_149.1588_NASA_2022_60min_50m.srw
  
  # Site parameters
  hub_height: 50.0              # Wind hub height override (meters)
  solar: true                   # Enable solar resource processing
  wind: true                    # Enable wind resource processing
  wave: false                   # Enable wave resource processing

# ================================================================================
# TECHNOLOGY CONFIGURATIONS
# ================================================================================
technologies:
  # PV Solar Array
  pv:
    system_capacity_kw: 9500.0    # PV capacity (kW) - MAIN OPTIMIZATION VARIABLE
    # Advanced PV parameters (see parameters_dictionary.yaml for full options):
    # module_type: 0              # 0=standard silicon (19%), 1=premium (21%), 2=thin film (18%)
    # dc_ac_ratio: 1.3            # DC to AC ratio (typically 1.2-1.4)
    # tilt: 20.0                  # Panel tilt angle (degrees)
    # azimuth: 180.0              # Panel azimuth (degrees) - 180=south facing
    # gcr: 0.4                    # Ground coverage ratio (0.3-0.5)
    
  # Wind Turbines
  wind:
    num_turbines: 6               # Number of turbines - MAIN OPTIMIZATION VARIABLE
    turbine_rating_kw: 1000       # Individual turbine rating (kW)
    # Advanced wind parameters (see parameters_dictionary.yaml for full options):
    # hub_height: 80.0            # Hub height (meters)
    # rotor_diameter: 77.0        # Rotor diameter (meters) 
    # cut_in_speed: 3.5           # m/s - Cut-in wind speed
    # cut_out_speed: 25.0         # m/s - Cut-out wind speed
    # rated_speed: 11.0           # m/s - Rated wind speed
    
  # Battery Storage
  battery:
    chemistry: LFPGraphite        # Battery chemistry type
    system_capacity_kw: 1900.0    # Battery power (kW) - MAIN OPTIMIZATION VARIABLE
    system_capacity_kwh: 8000.0   # Battery energy (kWh) - MAIN OPTIMIZATION VARIABLE
    # Advanced battery parameters (see parameters_dictionary.yaml for full options):
    # soc_min_pct: 20.0           # % - Minimum state of charge
    # soc_init_pct: 50.0          # % - Initial state of charge
    # round_trip_efficiency: 88.0 # % - Round-trip efficiency
    # replacement_year: 10        # years - Battery replacement schedule
    
  # Backup Generator
  genset:
    interconnect_kw: 18300.0      # Genset capacity (kW) - MAIN OPTIMIZATION VARIABLE
    # Advanced genset parameters (see parameters_dictionary.yaml for full options):
    # minimum_load_factor: 0.3    # - Minimum load (30% of rated capacity)
    # efficiency: 0.35            # - Electrical efficiency (35%)
    # fuel_cost_per_liter: 1.20   # $/L - Fuel cost
    # specific_co2_per_l_fuel: 2.618  # kg CO2/L - CO2 emissions
    
  # Grid Connection
  grid:
    enabled: true                 # ONLY GRID supports enabled/disabled
    interconnect_kw: 10000        # Grid connection capacity (kW)
    # Advanced grid parameters (see parameters_dictionary.yaml for full options):
    # base_import_price: 0.12     # $/kWh - Base import price
    # base_export_price: 0.08     # $/kWh - Base export price
    # peak_factor: 1.3            # - Peak price multiplier
    # off_peak_factor: 0.7        # - Off-peak price multiplier
    
  # Financial Configuration
  financial:
    Singleowner:
      analysis_period: 25         # years - Project lifetime
      real_discount_rate: 5.88    # % - Real discount rate

# ================================================================================
# SIMULATION CONFIGURATION
# ================================================================================
config:
  dispatch_options:
    battery_dispatch: heuristic_load_following  # Battery dispatch strategy
    grid_charging: true           # Allow battery charging from grid
    include_lifecycle_count: false # Include battery degradation in dispatch
    n_look_ahead_periods: 48      # hours - Forecast horizon for optimization
    pv_charging_only: false       # Restrict battery charging to PV only
    solver: glpk                  # Optimization solver
    
  simulation_options:
    start_year: 2022              # Simulation start year
    end_year: 2022                # Simulation end year
    time_steps_per_hour: 1        # Time resolution (1=hourly)
    
  optimization_options:
    algorithm: nelder_mead        # Optimization algorithm
    max_iterations: 1000          # Maximum optimization iterations
    tolerance: 1e-6               # Convergence tolerance