# Grid Configuration Parameters
# This file contains all grid-related pricing and operational parameters
# that were previously hardcoded in the system

grid:
  # Pricing parameters
  pricing:
    base_import_price: 0.12  # $/kWh - Base import price
    base_export_price: 0.08  # $/kWh - Base export price
    export_price_multiplier: 0.8  # - Export price multiplier (typically lower than import)
    import_price_multiplier: 1.0  # - Import price multiplier
    
  # Default dispatch factors for time-of-use pricing
  dispatch_factors:
    off_peak_factor: 0.7  # - Off-peak hours factor (midnight to 6 AM)
    standard_factor: 1.0  # - Standard hours factor
    peak_factor: 1.3  # - Peak hours factor (6 PM to 10 PM)
    
  # Time-of-use periods (hours of day)
  time_of_use:
    off_peak_start: 0  # hour - Off-peak start (midnight)
    off_peak_end: 6  # hour - Off-peak end (6 AM)
    peak_start: 18  # hour - Peak start (6 PM)
    peak_end: 22  # hour - Peak end (10 PM)
    
  # Grid connection parameters
  connection:
    default_interconnect_kw: 10000  # kW - Default interconnection capacity
    power_factor: 0.95  # - Power factor requirement
    voltage_regulation: 0.05  # - Voltage regulation requirement (±5%)
    
  # Reliability parameters
  reliability:
    availability: 0.999  # - Grid availability (99.9%)
    outage_duration_avg: 2.0  # hours - Average outage duration
    outage_frequency_per_year: 2.0  # - Number of outages per year