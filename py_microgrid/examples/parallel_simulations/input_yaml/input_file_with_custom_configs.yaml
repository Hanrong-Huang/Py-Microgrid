config:
  dispatch_options:
    battery_dispatch: heuristic_load_following
    grid_charging: true
    solver: glpk
    
name: custom_config_example

site:
  data:
    # Only required parameters
    lat: 39.7555  # Latitude (essential for weather data and solar calculations)
    lon: -105.2211  # Longitude (essential for weather data and solar calculations)
    
    # Optional: Year for weather data (defaults to 2012 if not specified)
    year: 2020
    
  # Load schedule from file
  desired_schedule: "py_microgrid/examples/parallel_simulations/load_data/desired_schedule_sample.csv"
  
  # Resource files (will be auto-generated if not provided)
  solar_resource_file: ""
  wind_resource_file: ""

technologies:
  # All components with enable/disable flags
  pv:
    enabled: true
    system_capacity_kw: 10000
    # Example: Override default efficiency from config files
    # approx_nominal_efficiency: 0.22  # 22% efficiency (higher than default)
    
  wind:
    enabled: true
    num_turbines: 5
    turbine_rating_kw: 1000
    
  battery:
    enabled: true
    chemistry: LFPGraphite
    system_capacity_kw: 2000
    system_capacity_kwh: 5000
    
  genset:
    enabled: true
    interconnect_kw: 15000
    
  grid:
    enabled: true
    interconnect_kw: 10000
    # Example: Override default pricing from config files
    # base_import_price: 0.15  # $0.15/kWh (higher than default $0.12/kWh)
    # base_export_price: 0.12  # $0.12/kWh (higher than default $0.08/kWh)
    
  financial:
    Singleowner:
      analysis_period: 25
      real_discount_rate: 5.88

# Example configuration override section
# This section demonstrates how users can override default parameters
# from the configuration files for specific project needs
custom_config_overrides:
  # Example: Override battery parameters for premium batteries
  battery:
    efficiency:
      round_trip_efficiency: 92.0  # Higher efficiency premium battery
    costs:
      installed_cost_per_kw: 700.0  # Lower cost due to economies of scale
      installed_cost_per_kwh: 350.0  # Lower cost due to economies of scale
    operation:
      soc_min_pct: 15.0  # Lower minimum SOC for premium chemistry
      
  # Example: Override PV parameters for high-efficiency modules
  pv:
    efficiency:
      default: 0.22  # 22% efficiency premium modules
    costs:
      installed_cost_per_kw: 1800.0  # Slightly higher cost for premium modules
      
  # Example: Override grid parameters for different utility rates
  grid:
    pricing:
      base_import_price: 0.18  # Higher utility rate
      base_export_price: 0.10  # Better export rate
    dispatch_factors:
      peak_factor: 1.8  # Higher peak rate multiplier
      off_peak_factor: 0.5  # Lower off-peak rate
      
  # Example: Override wind parameters for different site conditions
  wind:
    performance:
      default_max_cp: 0.48  # Higher efficiency for premium turbines
    costs:
      installed_cost_per_kw: 2200.0  # Lower cost due to bulk purchase