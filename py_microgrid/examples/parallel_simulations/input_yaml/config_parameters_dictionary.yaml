# Py-Microgrid Parameters Dictionary
# ================================================================================
# This file serves as a comprehensive reference for ALL available parameters
# in the Py-Microgrid system. Use this as a dictionary to understand what 
# parameters you can add to your configuration files.
#
# FOR NEW USERS:
# - Start with input_file_chunk_0.yaml (clean, minimal setup)
# - Use this file to understand what additional parameters you can customize
# - Copy parameters from here to your configuration file as needed
#
# FOR ADVANCED USERS:
# - This file shows the complete parameter space for system optimization
# - All parameters shown reference defaults in py_microgrid/simulation/config/*.yaml
# - Override any parameter by adding it to your input YAML file
#
# HOW TO USE THIS FILE:
# 1. Find the parameter you want to customize (e.g., PV module_type)
# 2. Copy the parameter line to your input YAML file
# 3. Uncomment it (remove the #) and modify the value
# 4. The system will use your custom value instead of the default
# ================================================================================

# ================================================================================
# PROJECT IDENTIFICATION
# ================================================================================
name: parameters_dictionary_example  # Project name for identification

# ================================================================================
# SITE CONFIGURATION 
# ================================================================================
site:
  data:
    # Required location parameters
    lat: -33.5265       # Latitude (degrees) - REQUIRED for solar/wind resource data
    lon: 149.1588       # Longitude (degrees) - REQUIRED for solar/wind resource data
    year: 2022          # Weather data year (2007-2022 available)
    
    # Optional site parameters
    site_boundaries:    # Define site boundaries for layout optimization (optional)
      verts:           # Vertices of site boundary (x,y coordinates in meters)
      - [0.0, 0.0]
      - [1000.0, 0.0]
      - [1000.0, 1000.0]
      - [0.0, 1000.0]
    
    # Grid utility rate database label (optional - for grid pricing)
    urdb_label: 5ca4d1175457a39b23b3d45e  # Utility rate database ID
    
  # Load schedule configuration (choose ONE option)
  # Option 1: Load from CSV file (recommended)
  desired_schedule: "path/to/load_data.csv"  # CSV file with hourly load data (MW)
  
  # Option 2: Inline constant load (for testing only)
  # desired_schedule: [10.0, 10.0, 10.0, ...]  # 24 or 8760 values (MW)
  
  # Resource file paths (auto-generated if not provided)
  solar_resource_file: ""   # Path to solar resource file (.csv) - auto-downloaded if empty
  wind_resource_file: ""    # Path to wind resource file (.srw) - auto-downloaded if empty
  
  # Site-specific parameters (optional)
  hub_height: 80.0         # Wind turbine hub height (meters) - overrides turbine default
  solar: true              # Enable solar resource processing
  wind: true               # Enable wind resource processing
  wave: false              # Enable wave resource processing (not implemented)

# ================================================================================
# TECHNOLOGY CONFIGURATIONS
# ================================================================================
technologies:

  # --------------------------------------------------------------------------------
  # PV (SOLAR PHOTOVOLTAIC) CONFIGURATION
  # --------------------------------------------------------------------------------
  pv:
    # SYSTEM SIZING (primary control parameters)
    system_capacity_kw: 15000.0    # PV array capacity (kW) - MAIN OPTIMIZATION VARIABLE
    
    # PERFORMANCE PARAMETERS (advanced users)
    # These reference pv_config.yaml defaults - override only if needed
    module_type: 0                 # 0=standard silicon (19%), 1=premium (21%), 2=thin film (18%)
    dc_ac_ratio: 1.3              # DC to AC ratio (typically 1.2-1.4)
    tilt: 20.0                    # Panel tilt angle (degrees) - site specific
    azimuth: 180.0                # Panel azimuth (degrees) - 180=south facing
    gcr: 0.4                      # Ground coverage ratio (0.3-0.5 typical)
    
    # COST PARAMETERS (reference pv_config.yaml)
    # Override these to customize economics
    # installed_cost_per_kw: 2000.0    # $/kW - Installation cost
    # om_cost_per_kw_per_year: 10.0    # $/kW/year - O&M cost

  # --------------------------------------------------------------------------------
  # WIND TURBINE CONFIGURATION  
  # --------------------------------------------------------------------------------
  wind:
    # SYSTEM SIZING (primary control parameters)
    num_turbines: 10               # Number of wind turbines - MAIN OPTIMIZATION VARIABLE
    turbine_rating_kw: 1000        # Individual turbine rating (kW) - typically 1000-3000 kW
    
    # TURBINE SPECIFICATIONS (advanced users)
    # These reference wind_config.yaml defaults - override only if needed
    hub_height: 80.0              # Hub height (meters) - affects wind resource
    rotor_diameter: 77.0          # Rotor diameter (meters) - affects power curve
    
    # PERFORMANCE PARAMETERS (reference wind_config.yaml)
    # cut_in_speed: 3.5             # m/s - Cut-in wind speed
    # cut_out_speed: 25.0           # m/s - Cut-out wind speed  
    # rated_speed: 11.0             # m/s - Rated wind speed
    
    # COST PARAMETERS (reference wind_config.yaml)
    # installed_cost_per_kw: 2500.0    # $/kW - Installation cost
    # om_cost_per_kw_per_year: 40.0    # $/kW/year - O&M cost

  # --------------------------------------------------------------------------------
  # BATTERY STORAGE CONFIGURATION
  # --------------------------------------------------------------------------------
  battery:
    # SYSTEM SIZING (primary control parameters)
    system_capacity_kwh: 10000.0  # Battery energy capacity (kWh) - MAIN OPTIMIZATION VARIABLE
    system_capacity_kw: 2500.0    # Battery power capacity (kW) - MAIN OPTIMIZATION VARIABLE
    
    # BATTERY CHEMISTRY (affects all performance parameters)
    chemistry: "LFPGraphite"       # Options: "LFPGraphite", "NMC", "LiIon"
    
    # OPERATIONAL PARAMETERS (reference battery_config.yaml)
    # Override these for custom battery operation
    # soc_min_pct: 20.0             # % - Minimum state of charge (depth of discharge)
    # soc_init_pct: 50.0            # % - Initial state of charge
    # round_trip_efficiency: 88.0   # % - Round-trip efficiency including inverter losses
    
    # ECONOMIC PARAMETERS (reference battery_config.yaml)
    # installed_cost_per_kw: 840.0     # $/kW - Power cost (inverter, controls)
    # installed_cost_per_kwh: 420.0    # $/kWh - Energy cost (battery cells)
    # replacement_year: 10             # years - Battery replacement schedule
    # lifecycle_cost_per_kWh_cycle: 0.0265  # $/kWh-cycle - Cycling cost

  # --------------------------------------------------------------------------------
  # GENSET (BACKUP GENERATOR) CONFIGURATION
  # --------------------------------------------------------------------------------
  genset:
    # SYSTEM SIZING (primary control parameter)
    interconnect_kw: 20000.0       # Genset capacity (kW) - MAIN OPTIMIZATION VARIABLE
    
    # OPERATIONAL PARAMETERS (reference genset_config.yaml)
    # Override these for custom genset operation
    # minimum_load_factor: 0.3         # - Minimum load (30% of rated capacity)
    # efficiency: 0.35                 # - Electrical efficiency (35%)
    # specific_fuel_consumption_l_per_kwh: 0.250  # L/kWh - Fuel consumption
    
    # COST PARAMETERS (reference genset_config.yaml)
    # install_cost_per_kw: 500.0       # $/kW - Installation cost
    # fuel_cost_per_liter: 1.20        # $/L - Fuel cost
    # om_cost_per_kw_per_op_hour: 0.03 # $/kW/hour - O&M cost per operating hour
    # operational_life_hours: 15000    # hours - Engine life
    
    # ENVIRONMENTAL PARAMETERS (reference genset_config.yaml)
    # specific_co2_per_l_fuel: 2.618   # kg CO2/L - CO2 emissions per liter

  # --------------------------------------------------------------------------------
  # GRID CONNECTION CONFIGURATION
  # --------------------------------------------------------------------------------
  grid:
    # GRID CONNECTION CONTROL (primary control parameter)
    enabled: false                 # ONLY GRID supports enabled/disabled - CRITICAL CONTROL
    
    # SYSTEM SIZING (when enabled)
    interconnect_kw: 15000         # Grid interconnection capacity (kW)
    
    # PRICING PARAMETERS (reference grid_config.yaml)
    # Override these for custom grid pricing
    # base_import_price: 0.12          # $/kWh - Base import price
    # base_export_price: 0.08          # $/kWh - Base export price (typically lower)
    
    # TIME-OF-USE PARAMETERS (reference grid_config.yaml)
    # off_peak_factor: 0.7             # - Off-peak price multiplier
    # peak_factor: 1.3                 # - Peak price multiplier
    # peak_start: 18                   # hour - Peak period start (6 PM)
    # peak_end: 22                     # hour - Peak period end (10 PM)

  # --------------------------------------------------------------------------------
  # FINANCIAL CONFIGURATION
  # --------------------------------------------------------------------------------
  financial:
    Singleowner:
      analysis_period: 25            # years - Project lifetime
      real_discount_rate: 5.88       # % - Real discount rate (inflation-adjusted)
      
      # Additional financial parameters (optional)
      # federal_tax_rate: 26.0         # % - Federal tax rate
      # state_tax_rate: 5.0            # % - State tax rate
      # property_tax_rate: 1.0         # % - Property tax rate
      # insurance_rate: 0.5            # % - Insurance rate

# ================================================================================
# SIMULATION AND OPTIMIZATION CONFIGURATION
# ================================================================================
config:
  
  # --------------------------------------------------------------------------------
  # DISPATCH OPTIONS (how system operates hour-by-hour)
  # --------------------------------------------------------------------------------
  dispatch_options:
    # BATTERY DISPATCH STRATEGY
    battery_dispatch: heuristic_load_following  # Options:
    # - "heuristic_load_following": Simple load following
    # - "look_ahead": Predictive optimization
    # - "custom": User-defined dispatch
    
    # GRID CHARGING CONTROL
    grid_charging: false           # Allow battery charging from grid (when grid enabled)
    
    # OPTIMIZATION SOLVER  
    solver: glpk                   # Options: "glpk", "cbc", "gurobi" (if licensed)
    
    # BATTERY OPERATIONAL CONTROL
    pv_charging_only: false        # Restrict battery charging to PV only
    include_lifecycle_count: false # Include battery degradation in dispatch
    
    # PREDICTIVE DISPATCH PARAMETERS (when using look_ahead)
    n_look_ahead_periods: 48       # hours - Forecast horizon for optimization
    
    # DISPATCH PARAMETERS (reference dispatch_config.yaml)
    # max_load_reduction_percentage: 0.2  # - Maximum demand response (20%)

  # --------------------------------------------------------------------------------
  # SIMULATION OPTIONS (time and resolution control)
  # --------------------------------------------------------------------------------
  simulation_options:
    start_year: 2022               # Simulation start year
    end_year: 2022                 # Simulation end year (typically same for 1 year)
    time_steps_per_hour: 1         # Time resolution (1=hourly, 4=15min, etc.)
    
    # ADVANCED SIMULATION PARAMETERS (optional)
    # lifetime_sim: false            # Run full lifetime simulation (vs 1 year)
    # skip_financial: false          # Skip financial calculations for speed

  # --------------------------------------------------------------------------------  
  # OPTIMIZATION OPTIONS (for system sizing optimization)
  # --------------------------------------------------------------------------------
  optimization_options:
    # OPTIMIZATION ALGORITHM
    algorithm: nelder_mead         # Optimization algorithm - preserved original
    
    # CONVERGENCE CRITERIA
    max_iterations: 1000           # Maximum optimization iterations
    tolerance: 1e-6                # Convergence tolerance
    
    # PENALTY FUNCTION PARAMETERS (for demand satisfaction)
    # demand_satisfaction_target: 100.0   # % - Target demand satisfaction
    # penalty_factor: 100.0               # - Penalty multiplier for unmet demand
    
    # FLEXIBLE LOAD PARAMETERS
    # enable_flexible_load: true           # Allow demand response
    # max_load_reduction_percentage: 0.2   # Maximum load reduction (20%)

# ================================================================================
# CONTROL PARAMETER SUMMARY
# ================================================================================
# 
# PRIMARY CONTROL PARAMETERS (what users typically modify):
# 1. technologies.pv.system_capacity_kw       - PV array size
# 2. technologies.wind.num_turbines           - Number of wind turbines  
# 3. technologies.wind.turbine_rating_kw      - Individual turbine size
# 4. technologies.battery.system_capacity_kwh - Battery energy capacity
# 5. technologies.battery.system_capacity_kw  - Battery power capacity
# 6. technologies.genset.interconnect_kw      - Backup generator capacity
# 7. technologies.grid.enabled                - Grid connection on/off
# 8. technologies.grid.interconnect_kw        - Grid connection capacity
# 9. site.data.lat/lon                        - Location coordinates
# 10. site.desired_schedule                   - Load profile
#
# SECONDARY CONTROL PARAMETERS (advanced users):
# - All cost parameters (reference config/*.yaml files)
# - All performance parameters (efficiency, operational limits)
# - All dispatch parameters (how system operates)
# - All optimization parameters (convergence, algorithms)
#
# HOW THESE CONTROL THE SYSTEM:
# - PV/Wind/Battery/Genset sizing → Optimization variables in Nelder-Mead
# - Grid enabled/disabled → Changes system architecture (grid-tied vs off-grid)
# - Load schedule → Defines demand that system must meet
# - Location → Determines solar/wind resource availability
# - Cost parameters → Affects economic optimization (LCOE calculation)
# - Dispatch parameters → Controls hour-by-hour operation
# - Financial parameters → Affects NPV and economic feasibility
#
# CRITICAL NOTE: Only 'grid' supports 'enabled' parameter!
# PV, Wind, Battery, Genset are controlled through optimization bounds,
# not through enabled/disabled flags.
# ================================================================================